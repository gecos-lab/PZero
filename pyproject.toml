[tool.semantic_release]
commit_parser = "conventional"

[tool.semantic_release.commit_parser_options]
ignore_merge_commits = true

# Only these trigger releases
major_tags = ["BREAKING CHANGE"]
minor_tags = ["feat"]
patch_tags = ["fix"]

# These NEVER trigger releases
allowed_tags = [
    "feat",
    "fix",
    "build",
    "chore",
    "ci",
    "docs",
    "style",
    "refactor",
    "perf",
    "test"
]